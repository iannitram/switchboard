# CI on Linux, Mac and Windows (R04). The core and the CLI build and test on all three; the
# React face's type check and tests run on Linux. The Tauri app is checked on Linux (clippy and tests); the
# AppImage build runs inside the build container on the Strix Halo computer (SHELL-1), not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Tauri app is not a default member, so the job above never compiles it. Check it here,
  # on Linux, with the system libraries Tauri 2 needs (the AppImage build stays in the container).
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true"
          if ! timeout 120 sudo apt-get $APT_OPTS update; then
            echo "apt-get update failed; dropping the Azure mirror and retrying"
            echo "--- before: apt-mirrors.txt"; cat /etc/apt/apt-mirrors.txt || true
            echo "--- before: sources"; cat /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            echo "--- after: apt-mirrors.txt"; cat /etc/apt/apt-mirrors.txt || true
            echo "--- after: sources"; cat /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            timeout 120 sudo apt-get $APT_OPTS update
          fi
          timeout 600 sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: cargo clippy -p switchboard-app --all-targets -- -D warnings
      - run: cargo test -p switchboard-app

  face:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test

  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I -m unittest discover -s tools -p "test_*.py" -v
      - run: python3 -I tools/check-notices.py
